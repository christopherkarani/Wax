name: Production Readiness Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hermes-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Hermes plugin tests
        run: bash Resources/scripts/quality/hermes_plugin_tests.sh

  gates:
    # Keep the verification runner aligned with the release build. macos-latest
    # currently resolves to macOS 26, whose CoreML MiniLM runtime emits
    # non-finite vectors for this model on every compute-unit configuration.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        mode: [full, soak-smoke, burn-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Production Gate
        run: |
          bash Resources/scripts/quality/production_readiness_gates.sh ${{ matrix.mode }}
