name: Release waxmcp npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump (patch/minor/major) or semver (for manual release)
        required: false
        default: patch
  push:
    tags:
      - "waxmcp-v*"

permissions:
  contents: read

# One release per ref at a time; never cancel a release that is mid-publish.
concurrency:
  # One release at a time across all tags: every release touches the shared
  # Homebrew formula branch and tap.
  group: release-waxmcp
  cancel-in-progress: false

jobs:
  # A tag must not publish binaries the production gate never verified. Same
  # runner, Xcode, and `full` mode as the quality-gates.yml PR/main gate.
  gates:
    name: Production gate (full)
    timeout-minutes: 90
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep in sync with quality-gates.yml.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"
      - name: Run Production Gate
        run: bash Resources/scripts/quality/production_readiness_gates.sh full

  build:
    name: Build wax + wax-mcp (${{ matrix.platform }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use macos-15 + Xcode Swift (not the OSS toolchain). GRDB 7 requires
          # Apple SDK Sendable conformances for DispatchQoS / DispatchSpecificKey
          # that the open-source Swift 6.2 snapshot on macos-14 does not provide.
          #
          # darwin-x64 is intentionally omitted: MetalANNS Float16 paths require
          # Apple Silicon and fail when cross-compiling to x86_64. Published
          # waxmcp packages have effectively been arm64-only since 0.1.21.
          - runs-on: macos-15
            platform: darwin-arm64
            triple: arm64-apple-macosx14.0
            source_build: true
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Show Swift / Xcode toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Set release version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ./Resources/scripts/sync-waxmcp-version.sh "${VERSION}"
          else
            ./Resources/scripts/sync-waxmcp-version.sh "${GITHUB_REF_NAME#waxmcp-v}"
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Build binaries
        if: ${{ matrix.source_build }}
        run: |
          set -euo pipefail
          ./Resources/scripts/build-waxmcp-binaries.sh "${{ matrix.platform }}" "${{ matrix.triple }}"

      - name: Reuse checked-in binaries
        if: ${{ !matrix.source_build }}
        run: |
          set -euo pipefail
          ./Resources/scripts/build-waxmcp-binaries.sh "${{ matrix.platform }}"

      - name: Verify packaged binaries
        run: |
          set -euo pipefail
          PLATFORM_DIR="Resources/npm/waxmcp/dist/${{ matrix.platform }}"
          test -f "$PLATFORM_DIR/wax-cli"
          test -f "$PLATFORM_DIR/wax-cli.sha256"
          (
            cd "$PLATFORM_DIR"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 -c wax-cli.sha256
            else
              sha256sum -c wax-cli.sha256
            fi
          )
          # Verify wax-mcp binary exists (for source builds)
          if [[ "${{ matrix.source_build }}" == "true" ]]; then
            test -f "$PLATFORM_DIR/wax-mcp"
            test -f "$PLATFORM_DIR/wax-mcp.sha256"
            (
              cd "$PLATFORM_DIR"
              if command -v shasum >/dev/null 2>&1; then
                shasum -a 256 -c wax-mcp.sha256
              else
                sha256sum -c wax-mcp.sha256
              fi
            )
          fi
          test -d "$PLATFORM_DIR/Wax_WaxVectorSearchMiniLM.bundle"
          echo "MiniLM bundle present"

      - name: Smoke check MCP server
        if: ${{ matrix.source_build }}
        run: |
          set -euo pipefail
          Resources/npm/waxmcp/dist/${{ matrix.platform }}/wax-mcp --help

      - name: Smoke check CLI entrypoint
        if: ${{ matrix.source_build }}
        run: |
          set -euo pipefail
          Resources/npm/waxmcp/dist/${{ matrix.platform }}/wax-cli mcp serve --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: waxmcp-${{ matrix.platform }}
          path: Resources/npm/waxmcp/dist/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: Publish waxmcp to npm
    needs: [gates, build]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'waxmcp-v') }}
    permissions:
      contents: read
      # npm provenance: signs the package with this workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore darwin-arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: waxmcp-darwin-arm64
          path: Resources/npm/waxmcp/dist/darwin-arm64

      - name: Set package version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ./Resources/scripts/sync-waxmcp-version.sh "${VERSION}"
          else
            ./Resources/scripts/sync-waxmcp-version.sh "${GITHUB_REF_NAME#waxmcp-v}"
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Verify packaged binaries
        run: |
          set -euo pipefail
          chmod +x Resources/npm/waxmcp/dist/darwin-arm64/wax-cli
          test -x Resources/npm/waxmcp/dist/darwin-arm64/wax-cli
          # Make wax-mcp executable if present
          if [[ -f "Resources/npm/waxmcp/dist/darwin-arm64/wax-mcp" ]]; then
            chmod +x "Resources/npm/waxmcp/dist/darwin-arm64/wax-mcp"
            test -x "Resources/npm/waxmcp/dist/darwin-arm64/wax-mcp"
          fi

      - name: Verify package integrity
        run: |
          set -euo pipefail
          for bin in wax-cli wax-mcp; do
            chk="Resources/npm/waxmcp/dist/darwin-arm64/$bin.sha256"
            if [[ -f "$chk" ]]; then
              (
                cd "Resources/npm/waxmcp/dist/darwin-arm64"
                if command -v shasum >/dev/null 2>&1; then
                  shasum -a 256 -c "$bin.sha256"
                else
                  sha256sum -c "$bin.sha256"
                fi
              )
            fi
          done

      - name: Verify version consistency
        run: |
          set -euo pipefail
          NPM_VERSION=$(node -p "require('./Resources/npm/waxmcp/package.json').version")
          echo "npm package version: $NPM_VERSION"
          # Extract the server metadata version from main.swift and compare
          SWIFT_VERSION=$(grep -E 'static let version = "[0-9]+\.[0-9]+\.[0-9]+"' Sources/Wax/WaxReleaseInfo.swift | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Swift server version: $SWIFT_VERSION"
          if [ "$NPM_VERSION" != "$SWIFT_VERSION" ]; then
            echo "ERROR: version mismatch — npm=$NPM_VERSION swift=$SWIFT_VERSION"
            echo "Update 'WaxReleaseInfo.version' in Sources/Wax/WaxReleaseInfo.swift to match Resources/npm/waxmcp/package.json"
            exit 1
          fi
          echo "Version consistency check passed: $NPM_VERSION"

      - name: Validate cross-channel version congruency
        run: |
          set -euo pipefail
          ./scripts/validate-congruency.sh --quiet || {
            echo "ERROR: Version surfaces are incongruent"
            ./scripts/validate-congruency.sh
            exit 1
          }
          echo "Cross-channel version congruency check passed"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          # Ensures subsequent steps can authenticate with secrets.NPM_TOKEN
          # via NODE_AUTH_TOKEN (required by the registry-url .npmrc template).

      - name: Test launcher, installer, and MCP handshake
        working-directory: Resources/npm/waxmcp
        run: npm test

      - name: Publish package
        working-directory: Resources/npm/waxmcp
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # bump-version.sh can only hash a local git archive. brew downloads GitHub's
  # tag tarball, which hashes differently — finalize after the tag exists.
  # The in-repo formula bump goes through a pull request; CI never pushes main.
  homebrew:
    name: Finalize Homebrew formula
    needs: [gates, build]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'waxmcp-v') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF_NAME#waxmcp-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # Prefer a PAT that can also push christopherkarani/homebrew-wax.
          # Falls back to the job token for the in-repo formula PR branch.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}

      - name: Finalize formula sha256 from GitHub archive
        run: |
          set -euo pipefail
          ./Resources/scripts/finalize-homebrew-formula.sh "${{ steps.version.outputs.version }}"

      - name: Open pull request for vendored formula if changed
        env:
          # A PAT-authored PR triggers the PR gates; a GITHUB_TOKEN PR does not.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          FORMULA="Resources/npm/waxmcp/homebrew-wax/Formula/wax.rb"
          if git diff --quiet -- "$FORMULA"; then
            echo "Vendored Homebrew formula already matches GitHub archive"
            exit 0
          fi
          BRANCH="release/homebrew-sha-waxmcp-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$FORMULA"
          git commit -m "fix(release): Homebrew sha256 for waxmcp-v${VERSION}"
          # The branch is bot-owned and rebuilt from main on every run, so a plain
          # --force keeps reruns idempotent (a fresh checkout has no tracking ref
          # for --force-with-lease to compare against).
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            echo "Formula PR for ${BRANCH} already open"
            exit 0
          fi
          # npm is already published at this point, so a PR the token may not open
          # (repo blocks Actions-created PRs and HOMEBREW_TAP_TOKEN is unset) must
          # not turn the release red. Leave the branch and a link to open it by hand.
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(release): Homebrew sha256 for waxmcp-v${VERSION}" \
            --body "Finalizes the vendored Homebrew formula sha256 from the GitHub archive for tag \`waxmcp-v${VERSION}\`. Opened by the release workflow."; then
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Could not open the Homebrew formula PR automatically. Open it manually: ${COMPARE_URL}"
            {
              echo "### Homebrew formula PR needs a manual open"
              echo ""
              echo "Branch \`${BRANCH}\` holds the finalized sha256 for \`waxmcp-v${VERSION}\`."
              echo "Open the PR here: ${COMPARE_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync christopherkarani/homebrew-wax tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::warning::secrets.HOMEBREW_TAP_TOKEN not set — skipped homebrew-wax tap sync."
            echo "Add a PAT (contents:write on christopherkarani/homebrew-wax) as HOMEBREW_TAP_TOKEN to enable it."
            exit 0
          fi
          ./Resources/scripts/finalize-homebrew-formula.sh \
            "${{ steps.version.outputs.version }}" \
            --push-tap
