name: WaxCore Linux

on:
  pull_request:
  push:
    branches: [main]

jobs:
  waxcore-linux:
    runs-on: ubuntu-latest
    container:
      image: swift:6.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Swift toolchain
        run: |
          swift --version
          swift package --version

      - name: Install Linux codec dependencies
        run: |
          apt-get update
          apt-get install -y liblz4-dev zlib1g-dev libsqlite3-dev

      - name: Build WaxCore target
        run: swift build --target WaxCore -Xswiftc -DGRDBCUSTOMSQLITE

      - name: Run WaxCore tests
        run: swift test --filter WaxCoreTests -Xswiftc -DGRDBCUSTOMSQLITE
